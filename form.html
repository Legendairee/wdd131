<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Submit a detailed product review, rate performance, and share feedback. For WDD 131 | Dynamic Web Fundamentals.">
        <meta name="author" content="Mathew Udowa Oghenemairo">
        <title>Product Review Form | WDD 131 | Mathew Udowa Oghenemairo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/form.css">
        <script src="scripts/form.js" defer></script>
    </head>

    <body>
        <div class="form-container">
            <!-- This is my Header section  -->
            <header>
                <h1>Product Review</h1>
            </header>
    
            <!-- This is my Main section  -->
            <main>
                <form id="reviewForm" class="review-form" method="get" action="review.html">
                    <div class="form-group">
                        <label for="product">Product Name <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <select id="product" name="product" required>
                                <option value="" disabled selected>Select a Product ...</option>
                            </select>
                        </div>
                    </div>
    
                    <fieldset class="form-group border-none">
                        <legend>Overall Rating <span class="required">*</span></legend>
                        <div class="rating-container">
                            <label class="star-label" for="rating1">
                                <input type="radio" id="rating1" name="rating" value="1" required>
                                <span class="star">&#9733;</span>
                            </label>
                            <label class="star-label" for="rating2">
                                <input type="radio" id="rating2" name="rating" value="2" required>
                                <span class="star">&#9733;</span>
                            </label>
                            <label class="star-label" for="rating3">
                                <input type="radio" id="rating3" name="rating" value="3" required>
                                <span class="star">&#9733;</span>
                            </label>
                            <label class="star-label" for="rating4">
                                <input type="radio" id="rating4" name="rating" value="4" required>
                                <span class="star">&#9733;</span>
                            </label>
                            <label class="star-label" for="rating5">
                                <input type="radio" id="rating5" name="rating" value="5" required>
                                <span class="star">&#9733;</span>
                            </label>
                        </div>
                    </fieldset>
    
                    <div class="form-group">
                        <label for="date">Date of Installation <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="date" id="date" name="date" required>
                        </div>
                    </div>
    
                    <fieldset class="form-group border-none">
                        <legend>Which features did you find useful in the product?<br>
                            <small>(Check all that apply)</small>
                        </legend>
                        <div class="features-grid">
                            <label class="checkbox-item" for="durability">
                                <input type="checkbox" id="durability" name="features" value="durability"> Durability
                            </label>
                            <label class="checkbox-item" for="ease">
                                <input type="checkbox" id="ease" name="features" value="ease"> Ease of Use
                            </label>
                            <label class="checkbox-item" for="performance">
                                <input type="checkbox" id="performance" name="features" value="performance"> Performance
                            </label>
                            <label class="checkbox-item" for="design">
                                <input type="checkbox" id="design" name="features" value="design"> Design
                            </label>
                        </div>
                    </fieldset>
    
                    <div class="form-group">
                        <label for="review">Written Review <small>(Optional)</small></label>
                        <div class="input-wrapper">
                            <textarea id="review" name="review" rows="6"
                                placeholder="Share your experience with this product.."></textarea>
                        </div>
                    </div>
    
                    <div class="form-group">
                        <label for="name">Your Name <small>(Optional)</small></label>
                        <div class="input-wrapper">
                            <input type="text" id="name" name="name" placeholder="Henry Maxwell" autocomplete="name">
                        </div>
                    </div>
    
                    <input type="submit" class="submit-btn" value="Post My Review">
                </form>
            </main>
    
            <!-- This is my footer section -->
            <footer>
                <p>&copy; <span id="current-year"></span> 🌴 Mathew | Udowa 🌴 Lagos, Nigeria.</p>
                <p id="lastmodified"></p>
            </footer>
        </div>
    </body>

</html>
