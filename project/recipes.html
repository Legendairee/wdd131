<!DOCTYPE html>
<html lang="en">

    <!-- 
  ======================================================
  Recipes Page | Nigeria Food Recipe Finder
  Users can search and filter authentic Nigerian recipes
  by Cuisine name, region and cooking time.
  ======================================================
-->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Browse authentic Nigerian recipes for Jollof, Egusi, Afang and more.">
        <meta name="author" content="Mathew Udowa Oghenemairo">
        <title>Recipes | Nigeria Food Recipe Finder</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="styles/recipes.css">
        <script src="scripts/recipes.js" defer></script>
    </head>

    <body>

        <!-- ======== This is my Header section with the navigation menu ======== -->
        <header>
            <img src="./images/nigeria-food-logo.webp" alt="Nigeria Food Recipe Finder Logo" width="120" height="80">
            <button type="button" id="menu">☰</button>

            <nav>
                <ul class="navigation">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="recipes.html">Recipes</a></li>
                    <li><a href="kitchen.html">My Kitchen</a></li>
                </ul>
            </nav>
        </header>

        <!-- ===== This is main section =========== -->
        <main>
            <section class="page-header">
                <h1>Nigeria Food Recipes</h1>
                <p>Browse authentic Nigeria food recipes, filter, save and plan your meal</p>
            </section>

            <section class="filters">
                <form id="filter-form">

                    <div class="filter-group">
                        <label for="search">Search Delicacies<span class="required">*</span></label>
                        <input type="text" id="search" name="search" placeholder="Search by name.. E.g (Jollof Rice)" required>
                    </div>

                    <div class="filter-group">
                        <label for="region">Region<span class="required">*</span></label>
                        <select id="region" name="region" required>
                            <option value="" selected disabled>Pick a Region &#9662;</option>
                            <option value="Yoruba">Yoruba</option>
                            <option value="Igbo">Igbo</option>
                            <option value="Hausa">Hausa</option>
                            <option value="Calabar">Calabar</option>
                            <option value="Urhobo & Isoko">Urhobo & Isoko</option>
                            <option value="Esan Benin">Esan Benin</option>
                            <option value="Nigeria">Nigeria</option>
                            <option value="all">All Regions</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="time">Time<span class="required">(Optional)</span></label>
                        <select id="time" name="time">
                            <option value="all">Any Time &#9662;</option>
                            <option value="30">Under 30 mins</option>
                            <option value="45">Under 45 mins</option>
                            <option value="60">Under 60 mins</option>
                        </select>
                    </div>

                    <button type="submit" class="filter-button">Filter Recipes</button>
                </form>
            </section>

            <section class="featured">
                <div class="featured-grid" id="recipes-grid"></div>

                <button id="toggle-recipes-btn" class="view-all-button">View All Recipes ↓</button>

                <p id="no-results">
                    Sorry, no delicacy was found. Try different food.
                </p>
            </section>

        </main>

        <!-- ========== This is my footer =========== -->
        <footer>
            <p>&copy; <span id="current-year"></span> Nigeria Food Recipe Finder • Lagos, Nigeria.</p>
            <p id="lastModified"></p>
        </footer>

    </body>

</html>
