<!DOCTYPE html>
<html lang="en">

<!-- 
  ======================================================
  Homepage | Nigeria Food Recipe Finder
  This page introduces the website, shows featured Nigerian 
  recipes and popular regional dishes, and allows users to 
  navigate to the full recipes page.
  ======================================================
-->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Discover authentic Nigerian food recipes, regional cuisines, and traditional ingredients. Step-by-step cooking guides for dishes across all regions.">
        <meta name="author" content="Mathew Udowa Oghenemairo">
        <title>Nigerian Food Recipe Finder</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
            rel="stylesheet">
        <link rel="preload" href="./images/recipe-hero.webp" as="image" media="(min-width: 768px)">
        <link rel="preload" href="./images/mobile-recipe-hero.webp" as="image" media="(max-width: 767px)">
        <link rel="stylesheet" href="styles/home.css">
        <script src="scripts/home.js" defer></script>
    </head>

    <body>
        <!-- This is my header and navigation menu section -->
        <header>
            <img src="./images/nigeria-food-logo.webp" alt="Nigeria Food Recipe Finder Logo" width="120" height="80">
            <button type="button" id="menu" aria-label="Toggle Navigation Menu">☰</button>
            <nav>
                <ul class="navigation">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="recipes.html">Recipes</a></li>
                    <li><a href="kitchen.html">My Kitchen</a></li>
                </ul>
            </nav>
        </header>

        <!-- This is the Main section -->
        <main>
            <section class="hero">
                <picture class="hero-bg">
                    <source media="(min-width: 768px)" srcset="./images/recipe-hero.webp">
                    <img src="./images/mobile-recipe-hero.webp" alt="Nigerian food recipe image" width="700"
                        height="400" fetchpriority="high">
                </picture>

                <div class="hero-content">
                    <h1>Discover Nigeria Food Recipe</h1>
                    <button onclick="goToRecipes()" class="btn-primary">Browse Recipes</button>
                </div>
            </section>

            <!-- This is the featured recipes section -->
            <section⇩ class="featured">
                <h2>Featured Cuisine</h2>
                <div class="featured-grid" id="featured-grid"></div>
                <button class="btn-view-all">View All Recipes ⇩</button>
            </section>

            <!-- This is the regional dishes section -->
            <section class="regions">
                <h2>Explore Regions</h2>
                <div class="regions-grid" id="regions-grid"></div>
                <button class="btn-view-all">View All Regions ⇩</button>
            </section>
        </main>

        <!-- This is my footer section -->
        <footer>
            <p>&copy; <span id="current-year"></span> Nigeria Food Recipe Finder • Lagos, Nigeria.</p>
            <p id="lastModified"></p>
        </footer>
    </body>

</html>
