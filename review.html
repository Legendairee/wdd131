<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Product review submission confirmation and tracking of total submission count. For WDD 131 | Dynamic Web Fundamentals.">
        <meta name="author" content="Mathew Udowa Oghenemairo">
        <title>Review Confirmation | WDD 131 | Mathew Udowa Oghenemairo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/review.css">
        <script src="scripts/review.js" defer></script>
    </head>

    <body>
        <div class="form-container">
            <header>
                <h1>Thank You!</h1>
            </header>

            <main>
                <h2>Your review has been submitted successfully </h2>
                <p>We really appreciate your feedback!</p>

                <p>
                    Total Reviews Submitted: <strong id="reviewCount">0</strong>
                </p>

                <a href="form.html" class="submit-btn">
                    Submit Another Review
                </a>
            </main>

            <footer>
                <p>&copy; <span id="current-year"></span> 🌴 Mathew | Udowa 🌴 Lagos, Nigeria.</p>
                <p id="lastmodified"></p>
            </footer>
        </div>
    </body>

</html>
